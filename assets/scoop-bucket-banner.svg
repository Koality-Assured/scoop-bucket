<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-label="Koality-Assured Scoop Bucket Banner">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bannerBg" cx="25%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="50%" stop-color="#081020" />
      <stop offset="100%" stop-color="#03060C" />
    </radialGradient>

    <radialGradient id="iconHalo" cx="220" cy="210" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0078D7" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#005A9E" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="textAmbientGlow" cx="800" cy="180" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0078D7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="psBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0078D7" />
      <stop offset="100%" stop-color="#004E8C" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="90%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="azureGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#0078D7" />
      <stop offset="100%" stop-color="#003865" />
    </linearGradient>

    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="darkFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#0078D7" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cliBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#040812" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Terminal Grid Pattern -->
    <pattern id="bannerGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#0078D7" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.2" fill="#38BDF8" fill-opacity="0.14" />
    </pattern>
  </defs>

  <!-- 1. Background Structure -->
  <rect width="1200" height="420" rx="20" fill="url(#bannerBg)" />
  <rect width="1200" height="420" rx="20" fill="url(#bannerGrid)" />
  <circle cx="220" cy="210" r="230" fill="url(#iconHalo)" />
  <circle cx="800" cy="180" r="350" fill="url(#textAmbientGlow)" />

  <!-- Outer Border Rim -->
  <rect x="8" y="8" width="1184" height="404" rx="16" fill="none" stroke="url(#rimGrad)" stroke-width="2" />
  <rect x="14" y="14" width="1172" height="392" rx="12" fill="none" stroke="#0078D7" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="6 6" />

  <!-- Corner Brackets -->
  <path d="M 28 50 L 28 28 L 50 28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1172 50 L 1172 28 L 1150 28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 370 L 28 392 L 50 392" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1172 370 L 1172 392 L 1150 392" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- 2. Left Hero Emblem (Scoop Bucket & Ladle Vector Motif) -->
  <g transform="translate(40, 20)">
    <!-- Squircle Frame for Emblem -->
    <rect x="35" y="30" width="310" height="320" rx="44" fill="#060C18" fill-opacity="0.75" stroke="#1E293B" stroke-width="1.5" />
    <rect x="35" y="30" width="310" height="320" rx="44" fill="none" stroke="#0078D7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 8" />

    <!-- Corner Accents on Inner Frame -->
    <path d="M 50 65 L 50 50 L 65 50" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <path d="M 330 65 L 330 50 L 315 50" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <path d="M 50 315 L 50 330 L 65 330" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <path d="M 330 315 L 330 330 L 315 330" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

    <!-- Emblem Group with scale and translation -->
    <g transform="translate(190, 195) scale(0.68) translate(-256, -260)" filter="url(#dropShadow)">
      <!-- Base Shadow -->
      <ellipse cx="256" cy="390" rx="140" ry="24" fill="#02050A" fill-opacity="0.8" />

      <!-- Bucket Vessel -->
      <path d="M 140 230 C 140 210, 372 210, 372 230 C 372 250, 140 250, 140 230 Z" fill="#0A1324" stroke="#0078D7" stroke-width="2" stroke-opacity="0.5" />
      <path d="M 140 230 L 168 370 C 168 388, 344 388, 344 370 L 372 230 Z" fill="url(#darkFacetGrad)" stroke="#1E293B" stroke-width="2" />
      <path d="M 140 230 L 168 370 C 190 384, 230 387, 256 388 L 256 244 C 215 244, 165 239, 140 230 Z" fill="url(#charcoalGrad)" />
      <path d="M 256 244 L 256 388 C 282 387, 322 384, 344 370 L 372 230 C 347 239, 297 244, 256 244 Z" fill="#141E33" />
      <line x1="256" y1="244" x2="256" y2="388" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />

      <!-- Ribbon -->
      <path d="M 152 292 L 157 312 C 210 326, 302 326, 355 312 L 360 292 C 305 306, 207 306, 152 292 Z" fill="url(#psBlueGrad)" />
      <path d="M 154 300 C 210 315, 302 315, 358 300" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.9" filter="url(#subtleGlow)" />

      <!-- Mouth Lip -->
      <path d="M 140 230 C 140 252, 372 252, 372 230 L 372 238 C 372 260, 140 260, 140 238 Z" fill="url(#platinumGrad)" />
      <path d="M 140 230 C 140 248, 372 248, 372 230" fill="none" stroke="#FFFFFF" stroke-width="2" filter="url(#subtleGlow)" />

      <!-- Isometric Package Cube Inside Bucket -->
      <polygon points="256,150 316,182 256,214 196,182" fill="url(#platinumGrad)" stroke="#FFFFFF" stroke-width="1.5" />
      <polygon points="196,182 256,214 256,268 196,236" fill="url(#psBlueGrad)" stroke="#38BDF8" stroke-width="1" />
      <polygon points="256,214 316,182 316,236 256,268" fill="#005A9E" stroke="#0078D7" stroke-width="1" />

      <!-- Prompt Symbol on Package -->
      <g transform="translate(208, 204) scale(0.7)">
        <path d="M 6 4 L 18 12 L 6 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />
        <line x1="23" y1="20" x2="35" y2="20" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)" />
      </g>

      <!-- Scoop Ladle Motif -->
      <g id="ladleBanner">
        <path d="M 292 90 L 358 196 L 334 206 L 274 102 Z" fill="#0078D7" fill-opacity="0.25" filter="url(#neonBloom)" />
        <path d="M 292 90 L 356 194 L 340 203 L 278 100 Z" fill="url(#platinumGrad)" stroke="#FFFFFF" stroke-width="1.5" />
        <path d="M 284 94 L 348 197" stroke="#38BDF8" stroke-width="1.5" />
        <path d="M 270 94 L 302 76 L 316 98 L 284 116 Z" fill="url(#psBlueGrad)" stroke="#00F0FF" stroke-width="1.5" filter="url(#subtleGlow)" />
        <line x1="288" y1="84" x2="298" y2="102" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 336 195 L 378 222 C 378 248, 332 268, 292 264 C 278 262, 274 252, 286 244 L 336 195 Z" fill="url(#azureGlowGrad)" stroke="#00F0FF" stroke-width="2" filter="url(#subtleGlow)" />
        <path d="M 342 205 L 368 224 C 365 240, 334 254, 304 252 C 295 251, 292 245, 300 240 L 342 205 Z" fill="#0F172A" />
        <path d="M 378 222 C 378 248, 332 268, 292 264" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="url(#subtleGlow)" />
      </g>

      <!-- Particles -->
      <polygon points="172,130 182,136 172,142 162,136" fill="#00F0FF" filter="url(#subtleGlow)" />
      <polygon points="364,124 374,130 364,136 354,130" fill="#00F0FF" filter="url(#subtleGlow)" />
      <polygon points="214,94 222,99 214,104 206,99" fill="#38BDF8" />

      <!-- Front Badge -->
      <g transform="translate(226, 326)">
        <rect x="0" y="0" width="60" height="28" rx="6" fill="#080E1C" stroke="#0078D7" stroke-width="1.5" />
        <text x="10" y="19" font-family="'Cascadia Code', 'Consolas', monospace" font-size="14" font-weight="700" fill="#00F0FF">&gt;_</text>
        <text x="32" y="18" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#E2E8F0">PKG</text>
      </g>
    </g>
  </g>

  <!-- 3. Right Content Area: Typography, CLI Terminal, and Badges -->
  <g transform="translate(420, 0)">

    <!-- Category Pill Tag -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="288" height="26" rx="13" fill="#0A162C" stroke="#0078D7" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4" fill="#38BDF8" filter="url(#subtleGlow)" />
      <text x="26" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#93C5FD" letter-spacing="1.5">OFFICIAL SCOOP PACKAGE BUCKET</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="112" font-family="'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#titleGrad)" letter-spacing="1">KOALITY-ASSURED</text>
    <text x="390" y="112" font-family="'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#38BDF8" letter-spacing="1">BUCKET</text>

    <!-- Subtitle -->
    <text x="0" y="142" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
      Windows package distribution for Koality-Assured developer tooling, domain harnesses, and control planes.
    </text>

    <!-- Interactive Terminal Command Block -->
    <g transform="translate(0, 168)" filter="url(#dropShadow)">
      <!-- Console Window Box -->
      <rect x="0" y="0" width="730" height="136" rx="10" fill="url(#cliBoxGrad)" stroke="#1E293B" stroke-width="1.5" />

      <!-- Console Window Header -->
      <path d="M 0 10 C 0 4.5, 4.5 0, 10 0 L 720 0 C 725.5 0, 730 4.5, 730 10 L 730 30 L 0 30 Z" fill="#0B1324" stroke="#1E293B" stroke-width="1" />
      <line x1="0" y1="30" x2="730" y2="30" stroke="#1E293B" stroke-width="1" />

      <!-- Window Control Dots -->
      <circle cx="16" cy="15" r="5" fill="#EF4444" fill-opacity="0.8" />
      <circle cx="32" cy="15" r="5" fill="#F59E0B" fill-opacity="0.8" />
      <circle cx="48" cy="15" r="5" fill="#10B981" fill-opacity="0.8" />

      <!-- Header Title Text -->
      <text x="68" y="19" font-family="'Cascadia Code', 'Consolas', monospace" font-size="11" font-weight="600" fill="#64748B">PowerShell 7.x — scoop bucket add koality</text>

      <!-- PowerShell Line 1 (Add Bucket) -->
      <text x="18" y="60" font-family="'Cascadia Code', 'Consolas', monospace" font-size="13" font-weight="600" fill="#38BDF8">PS C:\&gt;</text>
      <text x="80" y="60" font-family="'Cascadia Code', 'Consolas', monospace" font-size="13" font-weight="600" fill="#E2E8F0">scoop bucket add koality</text>
      <text x="290" y="60" font-family="'Cascadia Code', 'Consolas', monospace" font-size="13" font-weight="500" fill="#60A5FA">https://github.com/Koality-Assured/scoop-bucket</text>

      <!-- PowerShell Line 2 (Install Harness) -->
      <text x="18" y="92" font-family="'Cascadia Code', 'Consolas', monospace" font-size="13" font-weight="600" fill="#38BDF8">PS C:\&gt;</text>
      <text x="80" y="92" font-family="'Cascadia Code', 'Consolas', monospace" font-size="13" font-weight="600" fill="#FFFFFF">scoop install harness</text>
      <text x="260" y="92" font-family="'Cascadia Code', 'Consolas', monospace" font-size="12" font-weight="400" fill="#64748B"># &lt;15ms cold startup Go binary</text>

      <!-- PowerShell Output Line (Success status) -->
      <text x="18" y="120" font-family="'Cascadia Code', 'Consolas', monospace" font-size="11.5" font-weight="500" fill="#34D399">'harness' (0.3.1) was installed successfully! Run 'harness --help' to get started.</text>
    </g>

    <!-- Bottom Feature Tag Pills -->
    <g transform="translate(0, 328)">
      <!-- Tag 1: Windows x64 & ARM64 -->
      <rect x="0" y="0" width="168" height="26" rx="6" fill="#0B1326" stroke="#0078D7" stroke-width="1" />
      <text x="10" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">&#x25C6;</text>
      <text x="24" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Windows x64 / ARM64</text>

      <!-- Tag 2: Zero Dependency -->
      <rect x="180" y="0" width="164" height="26" rx="6" fill="#0B1326" stroke="#0078D7" stroke-width="1" />
      <text x="190" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">&#x25C6;</text>
      <text x="204" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Sub-15ms Native CLIs</text>

      <!-- Tag 3: Verified Checksums -->
      <rect x="356" y="0" width="170" height="26" rx="6" fill="#0B1326" stroke="#0078D7" stroke-width="1" />
      <text x="366" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">&#x25C6;</text>
      <text x="380" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Verified SHA-256 Hashes</text>

      <!-- Tag 4: Auto-Updating -->
      <rect x="538" y="0" width="170" height="26" rx="6" fill="#0B1326" stroke="#0078D7" stroke-width="1" />
      <text x="548" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">&#x25C6;</text>
      <text x="562" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Automated Checkver CI</text>
    </g>

  </g>
</svg>
