<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Koality-Assured Scoop Bucket Logo">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0E1A30" />
      <stop offset="50%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#04070F" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#0078D7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#005A9E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- PowerShell & Azure Blue Gradients -->
    <linearGradient id="psBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0078D7" />
      <stop offset="100%" stop-color="#004E8C" />
    </linearGradient>

    <linearGradient id="azureGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#0078D7" />
      <stop offset="100%" stop-color="#003865" />
    </linearGradient>

    <!-- Platinum & Charcoal Metallic Gradients -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="darkFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0078D7" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern: Subtle Terminal Grid -->
    <pattern id="terminalGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0078D7" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- 1. Background Container -->
  <rect width="512" height="512" rx="104" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="104" fill="url(#terminalGrid)" />
  <circle cx="256" cy="265" r="210" fill="url(#coreGlow)" />

  <!-- Outer Squircle Frame with Precision Rim -->
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />
  <rect x="28" y="28" width="456" height="456" rx="80" fill="none" stroke="#0078D7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 8" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 462 80 L 462 50 L 432 50" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 432 L 50 462 L 80 462" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 462 432 L 462 462 L 432 462" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- 2. Central Motif: Scoop Package Bucket & Ladle Container -->
  <g filter="url(#dropShadow)">

    <!-- Bucket Outer Shadow / Base Platform -->
    <ellipse cx="256" cy="390" rx="140" ry="24" fill="#02050A" fill-opacity="0.8" />

    <!-- 2a. Scoop Bucket Vessel (Geometric Tapered Cylinder / Hex Vault) -->
    <!-- Bucket Back Rim -->
    <path d="M 140 230 C 140 210, 372 210, 372 230 C 372 250, 140 250, 140 230 Z" fill="#0A1324" stroke="#0078D7" stroke-width="2" stroke-opacity="0.5" />

    <!-- Bucket Vessel Body (Tapered Lower Section) -->
    <path d="M 140 230 L 168 370 C 168 388, 344 388, 344 370 L 372 230 Z" fill="url(#darkFacetGrad)" stroke="#1E293B" stroke-width="2" />

    <!-- Left & Right Facet Panels of Bucket (Geometric Slate & Blue Depth) -->
    <!-- Left Facet -->
    <path d="M 140 230 L 168 370 C 190 384, 230 387, 256 388 L 256 244 C 215 244, 165 239, 140 230 Z" fill="url(#charcoalGrad)" />
    <!-- Right Facet -->
    <path d="M 256 244 L 256 388 C 282 387, 322 384, 344 370 L 372 230 C 347 239, 297 244, 256 244 Z" fill="#141E33" />

    <!-- Front Vertical Accent Seam -->
    <line x1="256" y1="244" x2="256" y2="388" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />

    <!-- Bucket Mid Accent Band (PowerShell Cyber Ribbon) -->
    <path d="M 152 292 L 157 312 C 210 326, 302 326, 355 312 L 360 292 C 305 306, 207 306, 152 292 Z" fill="url(#psBlueGrad)" />
    <!-- Glowing Seam on Ribbon -->
    <path d="M 154 300 C 210 315, 302 315, 358 300" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.9" filter="url(#subtleGlow)" />

    <!-- Bottom Rim Ring -->
    <path d="M 168 370 C 168 388, 344 388, 344 370 C 344 358, 168 358, 168 370 Z" fill="#0F172A" stroke="#0078D7" stroke-width="1.5" />

    <!-- Bucket Upper Mouth Lip (Front Half) -->
    <path d="M 140 230 C 140 252, 372 252, 372 230 L 372 238 C 372 260, 140 260, 140 238 Z" fill="url(#platinumGrad)" />
    <path d="M 140 230 C 140 248, 372 248, 372 230" fill="none" stroke="#FFFFFF" stroke-width="2" filter="url(#subtleGlow)" />

    <!-- 2b. The Inside Emerging Software Package (Isometric Cube) -->
    <!-- Top Face of Package -->
    <polygon points="256,150 316,182 256,214 196,182" fill="url(#platinumGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Left Face of Package -->
    <polygon points="196,182 256,214 256,268 196,236" fill="url(#psBlueGrad)" stroke="#38BDF8" stroke-width="1" />
    <!-- Right Face of Package -->
    <polygon points="256,214 316,182 316,236 256,268" fill="#005A9E" stroke="#0078D7" stroke-width="1" />

    <!-- PowerShell Prompt '>_' on Package Left Face -->
    <g transform="translate(208, 204) scale(0.7)">
      <!-- Terminal Chevron > -->
      <path d="M 6 4 L 18 12 L 6 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />
      <!-- Terminal Underscore _ -->
      <line x1="23" y1="20" x2="35" y2="20" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)" />
    </g>

    <!-- Package Tape / Cross Ribbon -->
    <line x1="256" y1="150" x2="256" y2="214" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6" />
    <line x1="196" y1="182" x2="316" y2="182" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6" />

    <!-- 2c. The Iconic Scoop Ladle (Precision Angled Tool Dipping In) -->
    <!-- Scoop Handle Shaft -->
    <g id="scoopLadle">
      <!-- Glow under ladle handle -->
      <path d="M 292 90 L 358 196 L 334 206 L 274 102 Z" fill="#0078D7" fill-opacity="0.25" filter="url(#neonBloom)" />

      <!-- Main Scoop Ladle Handle Shaft -->
      <path d="M 292 90 L 356 194 L 340 203 L 278 100 Z" fill="url(#platinumGrad)" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M 284 94 L 348 197" stroke="#38BDF8" stroke-width="1.5" />

      <!-- Top Handle Grip (PowerShell Blue Geometric Cap) -->
      <path d="M 270 94 L 302 76 L 316 98 L 284 116 Z" fill="url(#psBlueGrad)" stroke="#00F0FF" stroke-width="1.5" filter="url(#subtleGlow)" />
      <line x1="288" y1="84" x2="298" y2="102" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

      <!-- Scoop Ladle Bowl / Shovel Blade (Lower Head) -->
      <!-- Outer Blade Curve -->
      <path d="M 336 195 L 378 222 C 378 248, 332 268, 292 264 C 278 262, 274 252, 286 244 L 336 195 Z" fill="url(#azureGlowGrad)" stroke="#00F0FF" stroke-width="2" filter="url(#subtleGlow)" />
      <!-- Blade Inner Hollow -->
      <path d="M 342 205 L 368 224 C 365 240, 334 254, 304 252 C 295 251, 292 245, 300 240 L 342 205 Z" fill="#0F172A" />
      <!-- Shovel Highlight Lip -->
      <path d="M 378 222 C 378 248, 332 268, 292 264" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="url(#subtleGlow)" />
    </g>

    <!-- 2d. Cyber Particle Elements / Software Artifact Sparkles -->
    <!-- Upward Floating Particle Cubes & Diamonds -->
    <!-- Particle 1 (Top Left) -->
    <polygon points="172,130 182,136 172,142 162,136" fill="#00F0FF" filter="url(#subtleGlow)" />
    <!-- Particle 2 (Top Mid Left) -->
    <polygon points="214,94 222,99 214,104 206,99" fill="#38BDF8" />
    <circle cx="214" cy="99" r="2" fill="#FFFFFF" />
    <!-- Particle 3 (Top Right) -->
    <polygon points="364,124 374,130 364,136 354,130" fill="#00F0FF" filter="url(#subtleGlow)" />
    <!-- Particle 4 (Right Flank) -->
    <polygon points="392,168 400,173 392,178 384,173" fill="#38BDF8" opacity="0.8" />
    <!-- Particle 5 (Far Left) -->
    <polygon points="128,198 136,203 128,208 120,203" fill="#0078D7" opacity="0.8" />

    <!-- Terminal Prompt Glyph Front Badge (Centered on Bucket Body) -->
    <g transform="translate(226, 326)">
      <rect x="0" y="0" width="60" height="28" rx="6" fill="#080E1C" stroke="#0078D7" stroke-width="1.5" />
      <text x="10" y="19" font-family="'Cascadia Code', 'Consolas', 'Segoe UI', monospace" font-size="14" font-weight="700" fill="#00F0FF">&gt;_</text>
      <text x="32" y="18" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#E2E8F0" letter-spacing="0.5">PKG</text>
    </g>

  </g>

  <!-- 3. Lower Identity Monogram (KOALITY SCOOP) -->
  <text x="256" y="440" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#64748B" letter-spacing="4" text-anchor="middle">KOALITY-ASSURED</text>
  <text x="256" y="462" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#38BDF8" letter-spacing="6" text-anchor="middle">SCOOP BUCKET</text>

  <!-- Precision Accent Line at Base -->
  <line x1="176" y1="476" x2="336" y2="476" stroke="url(#rimGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
