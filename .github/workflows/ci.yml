name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Validate JSON Syntax
        run: |
          python -c "
          import json
          from pathlib import Path
          for p in Path('bucket').glob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              print(f'Valid JSON: {p}')
          "

      - name: Verify Manifest Checksums against Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/validate_manifest.py
